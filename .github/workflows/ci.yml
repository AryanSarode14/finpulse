name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test

  ml:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finpulse
          POSTGRES_PASSWORD: finpulse
          POSTGRES_DB: finpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://finpulse:finpulse@localhost:5432/finpulse?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm exec tsx prisma/seed.ts
      - uses: astral-sh/setup-uv@v5
        with:
          working-directory: services/ml
      - run: uv sync
        working-directory: services/ml
      - run: uv run ruff check
        working-directory: services/ml
      - run: uv run pytest
        working-directory: services/ml
